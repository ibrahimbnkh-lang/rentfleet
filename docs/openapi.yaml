openapi: 3.1.0
info:
  title: RentFleet API
  description: |
    Vehicle rental management platform API for Algeria.
    
    ## Authentication
    All protected endpoints require a Bearer token obtained via POST /api/v1/auth/login.
    
    ## Versioning
    All endpoints are prefixed with `/api/v1/`.
    
    ## Pagination
    List endpoints return paginated results in the standard envelope:
    ```json
    {
      "data": [...],
      "meta": { "current_page": 1, "per_page": 15, "total": 100, "last_page": 7 },
      "links": { "first": "...", "last": "...", "prev": null, "next": "..." }
    }
    ```
    
    ## Error Format
    ```json
    {
      "error": {
        "code": "validation_failed",
        "message": "The given data was invalid.",
        "details": { "field": ["message"] }
      }
    }
    ```
    
    ## Module Inactive
    If a module is not licensed or inactive:
    ```json
    { "error": { "code": "module_inactive", "message": "This module is not active." } }
    ```
  version: 1.0.0
  contact:
    name: RentFleet Support
    email: support@rentfleet.dz
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000/api/v1
    description: Local development (XAMPP)
  - url: http://localhost:8080/api/v1
    description: Local development (Docker)

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Common ──────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: The given data was invalid.
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    # ─── Auth ─────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_at:
              type: string
              format: date-time
            user:
              $ref: '#/components/schemas/User'

    # ─── User ─────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        branch_id:
          type: integer
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        guard_name:
          type: string
        permissions:
          type: array
          items:
            type: string

    # ─── Branch ───────────────────────────────────────────────────────────────
    Branch:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

paths:
  # ─── Auth ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        '200':
          description: Logged out
        '401':
          description: Unauthenticated

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated

  # ─── Branches ─────────────────────────────────────────────────────────────
  /branches:
    get:
      tags: [Branches]
      summary: List branches
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Paginated branches
    post:
      tags: [Branches]
      summary: Create branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                is_active:
                  type: boolean
      responses:
        '201':
          description: Branch created

  /branches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Branches]
      summary: Get branch
      responses:
        '200':
          description: Branch
    put:
      tags: [Branches]
      summary: Update branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Branch updated
    delete:
      tags: [Branches]
      summary: Delete branch
      responses:
        '204':
          description: Branch deleted
